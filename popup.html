<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morse Code Translator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="mc-translator-app">
        <div class="container">
            <h1>Morse Code Translator</h1>
            
            <svg id="top-lightbulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18h6"></path>
                <path d="M10 22h4"></path>
                <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A6 6 0 1 0 7.5 11.5c.76.76 1.23 1.52 1.41 2.5"></path>
            </svg>

            <!-- iOS Silent Mode Note -->
            <div class="ios-note" id="ios-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <div>
                    <strong>iPhone / iPad Users</strong>
                    The hardware silent switch on the side of your device also mutes browser audio. Please <strong>flip the silent switch OFF</strong> (so no orange is visible) to hear Morse code sounds.
                </div>
            </div>

            <div class="grid">
                <!-- Text Box -->
                <div class="box box-text" id="box-text">
                    <div class="box-header" id="label-text">
                        Plain Text
                    </div>
                    <textarea id="text-input" placeholder="Type text here..."></textarea>
                    <div style="display: flex; gap: 0.5rem; padding: 0.5rem 1rem; border-top: 1px solid var(--border); background: var(--surface);">
                        <button id="copy-text" title="Copy Text" style="padding: 0.25rem 0.75rem; font-size: 0.75rem; flex: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                        <button id="clear-text" title="Clear Text" style="padding: 0.25rem 0.75rem; font-size: 0.75rem; flex: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Clear
                        </button>
                    </div>
                </div>

                <!-- Swap Button -->
                <div class="swap-container">
                    <button id="swap-btn" title="Swap Inputs">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
                    </button>
                </div>

                <!-- Morse Box -->
                <div class="box box-morse" id="box-morse">
                    <div class="box-header" id="label-morse">
                        Morse Code
                    </div>
                    <textarea id="morse-input" placeholder="Type morse code here..."></textarea>
                    <div style="display: flex; gap: 0.5rem; padding: 0.5rem 1rem; border-top: 1px solid var(--border); background: var(--surface);">
                        <button id="copy-morse" title="Copy Morse" style="padding: 0.25rem 0.75rem; font-size: 0.75rem; flex: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        </button>
                        <button id="clear-morse" title="Clear Morse" style="padding: 0.25rem 0.75rem; font-size: 0.75rem; flex: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                            Clear
                        </button>
                    </div>
                </div>
            </div>

            <!-- Advanced Dashboard -->
            <div class="dashboard">
                <!-- Playback Controls -->
                <div class="dash-row">
                    <button id="btn-play" class="primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        Play
                    </button>
                    <button id="btn-pause">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                        Pause
                    </button>
                    <button id="btn-stop" class="danger">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
                        Stop
                    </button>
                    <label class="toggle-label"><input type="checkbox" id="repeat-opt"> Repeat</label>
                </div>

                <!-- Settings Toggles -->
                <div class="dash-row">
                    <label class="toggle-label"><input type="checkbox" id="sound-opt" checked> Sound</label>
                    <label class="toggle-label"><input type="checkbox" id="light-opt"> Light</label>
                    <label class="toggle-label"><input type="checkbox" id="vibrate-opt"> Vibrate</label>
                    <select id="sound-type">
                        <option value="cw">CW Radio Type</option>
                        <option value="telegraph">Telegraph Sounder</option>
                    </select>
                </div>

                <!-- Sliders -->
                <div class="dash-row sliders">
                    <div class="slider-group">
                        <label>Speed <span id="speed-val">20 wpm</span></label>
                        <input type="range" id="speed-slider" min="5" max="50" value="20">
                    </div>
                    <div class="slider-group">
                        <label>Pitch <span id="pitch-val">600 Hz</span></label>
                        <input type="range" id="pitch-slider" min="300" max="1000" value="600">
                    </div>
                    <div class="slider-group">
                        <label>Volume <span id="volume-val">50%</span></label>
                        <input type="range" id="volume-slider" min="0" max="100" value="50">
                    </div>
                </div>

                <!-- Actions -->
                <div class="dash-row">
                    <button id="btn-share">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                        Send to friend / Share
                    </button>
                    <button id="btn-save">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Save Audio
                    </button>
                    <button id="btn-clear">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        Clear All
                    </button>
                </div>
            </div>
        </div>

        <div id="toast" class="toast">Action completed!</div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
